name: Build and verify Tracker 3.6.0
on:
  push:
    branches: [tracker-3.6.0-reviewed]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: python3 -c "import base64,pathlib,zipfile,io; b=''.join(p.read_text() for p in sorted(pathlib.Path('source').glob('*.b64')));zipfile.ZipFile(io.BytesIO(base64.b64decode(b))).extractall('.')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and compatibility dependencies
        working-directory: TrackerClassicAndroid/qa
        run: npm install --no-audit --no-fund
      - name: Application scenario tests
        id: scenarios
        continue-on-error: true
        working-directory: TrackerClassicAndroid/qa
        run: npm test 2>&1 | tee scenarios.log
      - name: Build offline WebView compatibility bundle
        working-directory: TrackerClassicAndroid/qa
        run: npm run bundle
      - name: Build APK and Java tests
        working-directory: TrackerClassicAndroid
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Validate native test reports
        working-directory: TrackerClassicAndroid
        run: python3 -c "import pathlib,xml.etree.ElementTree as E; roots=[E.parse(p).getroot() for p in pathlib.Path('app/build/test-results').rglob('TEST-*.xml')];assert roots and all(int(r.get('failures',0))+int(r.get('errors',0))==0 for r in roots)"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation and native file operations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r TrackerClassicAndroid/app/build/outputs/apk/release/app-release.apk
            adb install -r TrackerClassicAndroid/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant com.mersad.trackerclassic.stable android.permission.POST_NOTIFICATIONS; fi
            adb shell am instrument -w com.mersad.trackerclassic.stable.test/androidx.test.runner.AndroidJUnitRunner | tee TrackerClassicAndroid/qa/device-tests.log
            adb shell am start -W -n com.mersad.trackerclassic.stable/com.mersad.trackerclassic.MainActivity
            adb pull /sdcard/Android/data/com.mersad.trackerclassic.stable/files/qa-drawer.png TrackerClassicAndroid/qa/qa-drawer.png || true
            adb pull /sdcard/Android/data/com.mersad.trackerclassic.stable/files/qa-reopened.png TrackerClassicAndroid/qa/qa-reopened.png || true
            adb logcat -d > TrackerClassicAndroid/qa/logcat.txt
            adb exec-out screencap -p > TrackerClassicAndroid/qa/startup.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml TrackerClassicAndroid/qa/window.xml || true
            python3 -c "import pathlib; s=pathlib.Path('TrackerClassicAndroid/qa/device-tests.log').read_text();assert 'OK (' in s and 'FAILURES' not in s"
      - name: Collect build outputs and signing utility
        if: always()
        run: |
          mkdir -p deliverables
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging TrackerClassicAndroid/app/build/outputs/apk/release/app-release.apk > deliverables/manifest-info.txt || true
          cp TrackerClassicAndroid/app/build/outputs/apk/release/app-release.apk deliverables/ || true
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" deliverables/ || cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" deliverables/ || true
          cp TrackerClassicAndroid/qa/*.log TrackerClassicAndroid/qa/*.png TrackerClassicAndroid/qa/window.xml TrackerClassicAndroid/qa/logcat.txt deliverables/ || true
          tar -czf deliverables/qa-dependencies.tgz -C TrackerClassicAndroid/qa node_modules package-lock.json
          cp -r TrackerClassicAndroid/app/build/test-results deliverables/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tracker-3.6.0-api-${{ matrix.api }}
          path: deliverables
          retention-days: 7
      - name: Scenario gate
        if: steps.scenarios.outcome != 'success'
        run: exit 1
