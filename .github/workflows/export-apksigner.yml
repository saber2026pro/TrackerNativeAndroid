name: Export Android Apksigner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-apksigner.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
          mkdir -p output
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" output/apksigner
          chmod +x output/apksigner
          sha256sum output/apksigner.jar output/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-36-Apksigner
          path: output/*
          if-no-files-found: error
          retention-days: 30
