name: MoneyManager v3 Build Gate

on:
  workflow_dispatch:
  push:
    branches: [ money-manager-v3-build ]
    paths:
      - '.github/workflows/money-manager-v3-build.yml'

permissions:
  contents: write

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: money-manager-v3-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inspect source and build when complete
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          rm -rf mmv3-work money-manager-v3/build-output
          mkdir -p mmv3-work money-manager-v3/build-output
          REPORT="money-manager-v3/build-output/build-report.txt"
          {
            echo "MoneyManager 3.0.0 GitHub Build Gate"
            echo "commit=$GITHUB_SHA"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[source archive]"
            ls -l money-manager-v3/source.tar.xz || true
            sha256sum money-manager-v3/source.tar.xz || true
            xz -t money-manager-v3/source.tar.xz && echo "xz_test=PASS" || echo "xz_test=FAIL"
            echo "archive_files=$(tar -tJf money-manager-v3/source.tar.xz 2>/dev/null | wc -l)"
            echo "archive_listing:"
            tar -tJf money-manager-v3/source.tar.xz 2>/dev/null || true
          } > "$REPORT" 2>&1

          if ! tar -xJf money-manager-v3/source.tar.xz -C mmv3-work >>"$REPORT" 2>&1; then
            echo "gate=ARCHIVE_EXTRACT_FAILED" >> "$REPORT"
            exit 0
          fi

          PROJECT_DIR="$(find mmv3-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "gate=SOURCE_INCOMPLETE_NO_GRADLE_PROJECT" >> "$REPORT"
            echo "extracted_files:" >> "$REPORT"
            find mmv3-work -type f -printf '%P\n' | sort >> "$REPORT"
            exit 0
          fi

          echo "project_dir=$PROJECT_DIR" >> "$REPORT"
          APP_JS="$(find "$PROJECT_DIR/app/src/main/assets" -maxdepth 1 -name app.js -print -quit 2>/dev/null || true)"
          if [ -n "$APP_JS" ]; then
            if node --check "$APP_JS" >>"$REPORT" 2>&1; then echo "javascript=PASS" >>"$REPORT"; else echo "javascript=FAIL" >>"$REPORT"; fi
          else
            echo "javascript=NO_APP_JS" >>"$REPORT"
          fi

          if [ -x "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            BUILD_CMD=("$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" :app:assembleDebug --stacktrace)
          else
            BUILD_CMD=(gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace)
          fi

          if "${BUILD_CMD[@]}" >>"$REPORT" 2>&1; then
            echo "gradle_build=PASS" >> "$REPORT"
          else
            echo "gradle_build=FAIL" >> "$REPORT"
            exit 0
          fi

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "gate=NO_APK_OUTPUT" >> "$REPORT"
            exit 0
          fi

          cp "$APK" money-manager-v3/build-output/MoneyManager-v3.0.0-CI-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > money-manager-v3/build-output/aapt-badging.txt 2>&1 || true
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > money-manager-v3/build-output/apksigner-debug.txt 2>&1 || true
          sha256sum "$APK" >> "$REPORT"
          echo "gate=BUILD_PASS" >> "$REPORT"

      - name: Commit build gate report and CI APK
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add money-manager-v3/build-output
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "MoneyManager v3 build gate result"
            git push origin HEAD:money-manager-v3-build
          fi
