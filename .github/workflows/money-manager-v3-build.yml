name: MoneyManager v3 Android Toolchain

on:
  workflow_dispatch:
  push:
    branches: [ money-manager-v3-build ]
    paths:
      - '.github/workflows/money-manager-v3-build.yml'

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 platform and build tools
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p output/sdk/platforms/android-36 output/sdk/build-tools
          cp "$ANDROID_HOME/platforms/android-36/android.jar" output/sdk/platforms/android-36/android.jar
          cp -a "$ANDROID_HOME/build-tools/36.0.0" output/sdk/build-tools/
          tar -cJf output/android-api36-toolchain.tar.xz -C output sdk
          sha256sum output/android-api36-toolchain.tar.xz
          ls -lh output/android-api36-toolchain.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-Android-API36-Toolchain
          path: output/android-api36-toolchain.tar.xz
          if-no-files-found: error
          retention-days: 7
