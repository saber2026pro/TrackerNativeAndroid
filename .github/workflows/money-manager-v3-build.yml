name: MoneyManager v3 Chunk Audit

on:
  workflow_dispatch:
  push:
    branches: [ money-manager-v3-build ]
    paths:
      - '.github/workflows/money-manager-v3-build.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: money-manager-v3-build
      - name: Audit uploaded source chunk families
        shell: bash
        run: |
          set -u
          OUT=money-manager-v3/build-output/chunk-audit.txt
          mkdir -p money-manager-v3/build-output /tmp/mmchunk
          : > "$OUT"
          echo "MoneyManager v3 chunk audit" >> "$OUT"
          echo "commit=$GITHUB_SHA" >> "$OUT"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo >> "$OUT"
          for d in parts final15 final20 final-parts ci-final-8k ci-clean-20260908; do
            echo "=== $d ===" >> "$OUT"
            if [ ! -d "money-manager-v3/$d" ]; then echo MISSING >> "$OUT"; continue; fi
            find "money-manager-v3/$d" -maxdepth 1 -type f -printf '%f %s\n' | sort -V >> "$OUT"
            find "money-manager-v3/$d" -maxdepth 1 -type f -print0 | sort -zV | xargs -0 cat > "/tmp/mmchunk/$d.txt"
            echo "text_bytes=$(wc -c < /tmp/mmchunk/$d.txt)" >> "$OUT"
            sha256sum "/tmp/mmchunk/$d.txt" >> "$OUT"
            if base64 -d "/tmp/mmchunk/$d.txt" > "/tmp/mmchunk/$d.bin" 2>/tmp/mmchunk/err; then
              echo "base64=PASS binary_bytes=$(wc -c < /tmp/mmchunk/$d.bin)" >> "$OUT"
              sha256sum "/tmp/mmchunk/$d.bin" >> "$OUT"
              file "/tmp/mmchunk/$d.bin" >> "$OUT" 2>&1 || true
              xz -t "/tmp/mmchunk/$d.bin" >> "$OUT" 2>&1 && echo "xz=PASS" >> "$OUT" || echo "xz=FAIL" >> "$OUT"
              unzip -t "/tmp/mmchunk/$d.bin" >> "$OUT" 2>&1 && echo "zip=PASS" >> "$OUT" || echo "zip=FAIL" >> "$OUT"
            else
              echo "base64=FAIL $(cat /tmp/mmchunk/err)" >> "$OUT"
            fi
            echo >> "$OUT"
          done
          echo "=== overlap checks ===" >> "$OUT"
          if [ -f /tmp/mmchunk/parts.txt ] && [ -f /tmp/mmchunk/final15.txt ]; then
            n=$(wc -c < /tmp/mmchunk/parts.txt)
            head -c "$n" /tmp/mmchunk/final15.txt > /tmp/mmchunk/f15-prefix.txt
            if cmp -s /tmp/mmchunk/parts.txt /tmp/mmchunk/f15-prefix.txt; then echo "parts_vs_final15_prefix=SAME" >> "$OUT"; else echo "parts_vs_final15_prefix=DIFFERENT" >> "$OUT"; fi
            n2=$(wc -c < /tmp/mmchunk/final15.txt)
            head -c "$n2" /tmp/mmchunk/parts.txt > /tmp/mmchunk/parts-prefix.txt
            if cmp -s /tmp/mmchunk/final15.txt /tmp/mmchunk/parts-prefix.txt; then echo "final15_vs_parts_prefix=SAME" >> "$OUT"; else echo "final15_vs_parts_prefix=DIFFERENT" >> "$OUT"; fi
          fi
          cat "$OUT"
      - name: Commit audit report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add money-manager-v3/build-output/chunk-audit.txt
          git commit -m "MoneyManager v3 source chunk audit" || exit 0
          git push origin HEAD:money-manager-v3-build
