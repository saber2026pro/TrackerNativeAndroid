name: MoneyManager v3 Source Inspect

on:
  push:
    branches: [ money-manager-v3-build ]
    paths:
      - '.github/workflows/money-manager-v3-build.yml'
      - 'money-manager-v3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Inspect existing source archive
        run: |
          set -euxo pipefail
          ls -lh money-manager-v3/source.tar.xz
          sha256sum money-manager-v3/source.tar.xz
          xz -t money-manager-v3/source.tar.xz
          echo '--- archive listing ---'
          tar -tvJf money-manager-v3/source.tar.xz
          echo '--- archive files ---'
          tar -tJf money-manager-v3/source.tar.xz | wc -l
