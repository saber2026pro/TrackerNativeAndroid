name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TrackerNativeAndroid_build_ready*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'TrackerNativeAndroid_build_ready*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          echo "Using $ZIP_FILE"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/TrackerNativeAndroid/settings.gradle.kts

      - name: Build Debug APK
        run: |
          gradle -p extracted/TrackerNativeAndroid :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp extracted/TrackerNativeAndroid/app/build/outputs/apk/debug/app-debug.apk output/TrackerNativeAndroid-debug.apk
          sha256sum output/TrackerNativeAndroid-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerNativeAndroid-debug
          path: output/TrackerNativeAndroid-debug.apk
          if-no-files-found: error
          retention-days: 30
