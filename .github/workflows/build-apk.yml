name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TrackerClassicAndroid_v3.2.0*.zip'
      - 'TrackerNativeAndroid_build_ready*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract selected project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          CLASSIC_ZIP="$(find . -maxdepth 1 -type f -name 'TrackerClassicAndroid_v3.2.0*.zip' -print -quit)"
          if [ -n "$CLASSIC_ZIP" ]; then
            echo "Building classic app from $CLASSIC_ZIP"
            unzip -q "$CLASSIC_ZIP" -d extracted
            test -f extracted/TrackerClassicAndroid_v320/settings.gradle.kts
            echo 'PROJECT_DIR=extracted/TrackerClassicAndroid_v320' >> "$GITHUB_ENV"
            echo 'APK_NAME=نظام_متابعة_التقارير_والخطط_Classic_3.2.0.apk' >> "$GITHUB_ENV"
            echo 'ARTIFACT_NAME=TrackerClassicAndroid-3.2.0' >> "$GITHUB_ENV"
          else
            NATIVE_ZIP="$(find . -maxdepth 1 -type f -name 'TrackerNativeAndroid_build_ready*.zip' -print -quit)"
            test -n "$NATIVE_ZIP"
            echo "Building native app from $NATIVE_ZIP"
            unzip -q "$NATIVE_ZIP" -d extracted
            test -f extracted/TrackerNativeAndroid/settings.gradle.kts
            echo 'PROJECT_DIR=extracted/TrackerNativeAndroid' >> "$GITHUB_ENV"
            echo 'APK_NAME=TrackerNativeAndroid-debug.apk' >> "$GITHUB_ENV"
            echo 'ARTIFACT_NAME=TrackerNativeAndroid-debug' >> "$GITHUB_ENV"
          fi

      - name: Enable AndroidX
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' >> "$PROJECT_DIR/gradle.properties"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "output/$APK_NAME"
          sha256sum "output/$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
