name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TrackerClassicAndroid_v3.2.0*.zip'
      - 'TrackerNativeAndroid_build_ready*.zip'
      - 'overlay_v331/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract classic project
        shell: bash
        run: |
          rm -rf extracted overlay
          mkdir extracted overlay
          CLASSIC_ZIP="$(find . -maxdepth 1 -type f -name 'TrackerClassicAndroid_v3.2.0*.zip' -print -quit)"
          test -n "$CLASSIC_ZIP"
          echo "Building classic app from $CLASSIC_ZIP"
          unzip -q "$CLASSIC_ZIP" -d extracted
          test -f extracted/TrackerClassicAndroid_v320/settings.gradle.kts
          echo 'PROJECT_DIR=extracted/TrackerClassicAndroid_v320' >> "$GITHUB_ENV"
          echo 'APK_NAME=TrackerClassic_3.3.2_STABLE_INSTALL.apk' >> "$GITHUB_ENV"
          echo 'SOURCE_NAME=TrackerClassicAndroid_v3.3.2_STABLE_INSTALL_source.zip' >> "$GITHUB_ENV"
          echo 'ARTIFACT_NAME=TrackerClassicAndroid-3.3.2-STABLE-INSTALL' >> "$GITHUB_ENV"

      - name: Reconstruct and apply 3.3.1 feature update
        shell: bash
        run: |
          cat overlay_v331/part01.txt overlay_v331/part02.txt overlay_v331/part03.txt overlay_v331/part04.txt overlay_v331/part06.txt overlay_v331/part08.txt | tr -cd 'A-Za-z0-9+/=' > overlay-v331.b64
          test "$(wc -c < overlay-v331.b64)" -eq 24828
          base64 -d overlay-v331.b64 > overlay-v331.tar.gz
          echo '9dd014e0643961c340e93715a92d82f35ae25cbb5a1f46ec4a9ef6c4d3c9d53b  overlay-v331.tar.gz' | sha256sum -c -
          gzip -t overlay-v331.tar.gz
          tar -xzf overlay-v331.tar.gz -C overlay
          test -f overlay/tools/apply_v331.py
          python3 overlay/tools/apply_v331.py "$PROJECT_DIR"
          grep -q 'v3.3.1 stabilization' "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Prepare stable install identity 3.3.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extracted/TrackerClassicAndroid_v320/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('applicationId = "com.mersad.trackerclassic"','applicationId = "com.mersad.trackerclassic.stable"')
          s=s.replace('versionCode = 331','versionCode = 332')
          s=s.replace('versionName = "3.3.1-classic"','versionName = "3.3.2-stable"')
          p.write_text(s,encoding='utf-8')
          assert 'applicationId = "com.mersad.trackerclassic.stable"' in s
          assert 'versionCode = 332' in s
          assert 'versionName = "3.3.2-stable"' in s
          PY

      - name: Validate JavaScript and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('extracted/TrackerClassicAndroid_v320/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a >= 0 and b > a
          Path('/tmp/tracker-final.js').write_text(s[a+8:b],encoding='utf-8')
          ET.parse('extracted/TrackerClassicAndroid_v320/app/src/main/AndroidManifest.xml')
          PY
          node --check /tmp/tracker-final.js

      - name: Validate requested feature markers
        shell: bash
        run: |
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/mersad/trackerclassic/MainActivity.java"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'v330-progress-add' "$HTML"
          grep -q 'defaultReminderPreset' "$HTML"
          grep -q 'مؤشرات نشاط المستخدمين' "$HTML"
          grep -q 'تسجيل الخروج' "$HTML"
          grep -q 'السجلات المحذوفة' "$HTML"
          grep -q 'v330MergeProgress' "$HTML"
          grep -q 'duplicate' "$HTML"
          grep -q 'systemAdminId' "$HTML"
          grep -q 'deviceUserId' "$HTML"
          grep -q 'handleNativeBack' "$MAIN"
          grep -q 'ReminderScheduler.reschedule' "$MAIN"
          grep -q '.ReminderReceiver' "$MANIFEST"
          grep -q 'BOOT_COMPLETED' "$MANIFEST"
          grep -q 'minSdk = 23' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "com.mersad.trackerclassic.stable"' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Enable AndroidX
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' >> "$PROJECT_DIR/gradle.properties"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Verify APK and collect source
        shell: bash
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "output/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "output/$APK_NAME" | tee /tmp/badging.txt
          grep -q "package: name='com.mersad.trackerclassic.stable' versionCode='332'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          unzip -p "output/$APK_NAME" assets/index.html | grep -q 'v330-progress-add'
          unzip -p "output/$APK_NAME" assets/index.html | grep -q 'مؤشرات نشاط المستخدمين'
          unzip -p "output/$APK_NAME" assets/index.html | grep -q 'السجلات المحذوفة'
          (cd extracted && zip -qr "../output/$SOURCE_NAME" TrackerClassicAndroid_v320)
          sha256sum "output/$APK_NAME" "output/$SOURCE_NAME"
          unzip -t "output/$APK_NAME" >/dev/null
          unzip -t "output/$SOURCE_NAME" >/dev/null

      - name: Upload APK and source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
